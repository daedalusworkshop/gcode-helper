<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GCODE Helper</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23f4f1e8'/%3E%3Cpath d='M13 14h38v36H13zM22 25h20M22 33h20M22 41h12' fill='none' stroke='%231b1b19' stroke-width='4'/%3E%3Ccircle cx='46' cy='41' r='4' fill='%23e14b32'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <aside id="side" class="side">
    <div class="side-body">
      <label>Units
        <select id="unitsSelect"><option value="G20" selected>in</option><option value="G21">mm</option></select>
      </label>
      <label>Mode
        <select id="modeSelect"><option value="G90" selected>abs</option><option value="G91">inc</option></select>
      </label>
      <label>Safe Z
        <input id="safeZ" type="number" value="0.25" step="0.05">
      </label>
      <label>Grid
        <select id="gridStep"><option value="0.25">0.25</option><option value="0.5">0.5</option><option value="1" selected>1</option><option value="2">2</option></select>
      </label>
      <label>Vim
        <input type="checkbox" id="vimToggle">
      </label>
      <div class="photo">
        <input type="file" id="refFile" accept="image/*" hidden>
        <button type="button" class="photo-import" id="refImportBtn">+ Reference photo</button>
        <div id="refControls" class="photo-controls" hidden>
          <label>Opacity <span id="refOpacityVal">50%</span>
            <input id="refOpacity" type="range" min="0" max="100" value="50">
          </label>
          <div class="photo-pos">
            <label>X<input id="refX" type="number" step="0.1"></label>
            <label>Y<input id="refY" type="number" step="0.1"></label>
            <label>W<input id="refW" type="number" step="0.1" min="0.1"></label>
          </div>
          <button type="button" class="text-button" id="refRemoveBtn">Remove photo</button>
        </div>
      </div>
      <dl class="ref">
        <div><dt>G0</dt><dd>rapid move</dd></div>
        <div><dt>G1</dt><dd>straight move</dd></div>
        <div><dt>G2</dt><dd>arc · CW</dd></div>
        <div><dt>G3</dt><dd>arc · CCW</dd></div>
      </dl>
    </div>
  </aside>
  <button id="sideToggle" class="side-toggle" aria-label="Toggle setup" aria-expanded="true"></button>

  <section class="code">
    <pre id="codeHighlight" aria-hidden="true"></pre>
    <textarea id="codeEditor" aria-label="G-code" spellcheck="false" wrap="off"></textarea>
    <div id="codeStatus" hidden></div>
    <div id="vimMode" class="vim-mode-badge" hidden></div>
  </section>

  <section class="preview">
    <div class="corner top">
      <button class="text-button" id="newButton">New</button>
      <button class="text-button" id="copyButton">Copy</button>
      <button class="text-button" id="exportButton">Export</button>
    </div>
    <svg id="plot" viewBox="0 0 560 560" role="img" aria-label="XY toolpath"></svg>
    <div class="corner bottom">
      <div class="readout"><span id="cursorReadout"></span><span id="zReadout"></span><span id="pathLength"></span></div>
      <button class="solid-button" id="playButton">Run</button>
    </div>
  </section>

  <div class="toast" id="toast" role="status"></div>
  <script src="./app.js"></script>
</body>
</html>
